meter:
  host: 192.168.10.4
  port: 10001
  frame_gap: 0.8
  reconnect_delay: 5
  # Instalace bez fotovoltaiky/baterie nemůže reálně dodávat proud do sítě -
  # nastav na true, aby se každé nenulové čtení "dodávka"/export pole (OBIS
  # s `is_export: true` v obis.yaml) zahodilo jako podezření na poškozený
  # rámec, místo aby "viselo" jako aktuální stav senzoru. Pokud instalace
  # export skutečně má (FVE/baterie), nech na false (výchozí).
  assume_no_export: false

mqtt:
  host: 127.0.0.1
  port: 1883
  username: homeassistant
  password: kuliko
  qos: 1
  retain: false

topics:
  state: home/egd_meter/state
  availability: home/egd_meter/availability
  discovery_prefix: homeassistant

device:
  identifier: egd_sagemcom_xt211
  manufacturer: Sagemcom
  model: XT211
  name: EGD elektroměr

logging:
  level: INFO

recorder:
  enabled: false
  directory: samples
  save_last: false
  save_history: false

watchdog:
  enabled: true
  warning_after_seconds: 180
  reconnect_after_seconds: 600

runtime:
  directory: runtime
  status_file: status.json
